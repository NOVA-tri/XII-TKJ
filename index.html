
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Galeri Estetik</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #10101a;
    color: white;
}

header {
    padding: 25px;
    text-align: center;
    background: #191927;
}

header h1 {
    color: #00e5ff;
    letter-spacing: 3px;
}

nav {
    text-align: center;
    padding: 20px;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 12px;
}

.hero {
    text-align: center;
    padding: 70px 20px;
}

.hero h2 {
    font-size: 35px;
    color: #00e5ff;
}

.hero p {
    margin-top: 15px;
    color: #ccc;
}

.gallery {
    display: grid;
    grid-template-columns:
    repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 25px;
}

.gallery img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 15px;
    transition: 0.4s;
}

.gallery img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #00e5ff;
}

footer {
    text-align: center;
    padding: 25px;
    background: #191927;
    margin-top: 30px;
}
</style>
</head>

<body>

<header>
    <h1>MY GALLERY</h1>
    <p>Welcome to My Website</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#gallery">Gallery</a>
    <a href="#about">About</a>
</nav>

<section class="hero" id="home">
    <h2>Welcome To My Website</h2>
    <p>Tempat menyimpan kenangan dan foto terbaik.</p>
</section>

<section class="gallery" id="gallery">

    <img src="smkgc.jpg" alt="Mempercantik Lingkungan Sekolah Dengan Tanaman">

    <img src="sgc.jpg" alt="Album Usang">

    <img src="smk.jpg" alt="Album Usang">

    <img src="gc.jpg" alt="Mempercantik Lingkungan Sekolah Dengan Tanaman">
    
    <img src="global.jpg" alt="Kemenangan Lomba 71 Agustus">

</section>

<section class="hero" id="about">
    <h2>About Me</h2>
    <p>Website sederhana dengan desain modern dan estetik.</p>
</section>

<footer>
    <p>© 2026 My Gallery | Created by Me</p>
</footer>

</body>
</html>
